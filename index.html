<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DINASED - SISTEMA ESTADÍSTICO DE HOMICIDIOS INTENCIONALES</title>
  
  <!-- Ícono oficial para la pestaña -->
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1SACC-s80T33g-X2EaQ4r51JTE-Kt1RY-" type="image/png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08111e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Contenedor principal del iframe */
    #frame-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Respaldo de navegación por seguridad de navegador */
    .fallback-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 35, 58, 0.95);
      border: 1px solid #d4af37;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 0;
      max-width: 400px;
      width: 90%;
    }

    .fallback-card h2 {
      color: #d4af37;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .fallback-card p {
      font-size: 0.85rem;
      color: #d0e1f9;
      margin-bottom: 20px;
    }

    .btn-fallback {
      display: inline-block;
      background: linear-gradient(90deg, #d4af37, #b89228);
      color: #08111e;
      text-decoration: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- iFrame limpio sin restricciones de sandbox que activen el bloqueo de Drive -->
  <div id="frame-container">
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycby6MrGNAxRTQ_NLbE4rQDD25pP9WsLW8XMVxqWMSM5I8BcYVd-KBZ26A5cr-8UQN_UwDw/exec" 
      allow="fullscreen" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Respaldo en caso de bloqueo estricto de cookies en móviles o navegadores con protección elevada -->
  <div class="fallback-card">
    <h2>DINASED SANTO DOMINGO</h2>
    <p>Cargando el Sistema Estadístico...</p>
    <a href="https://script.google.com/macros/s/AKfycby6MrGNAxRTQ_NLbE4rQDD25pP9WsLW8XMVxqWMSM5I8BcYVd-KBZ26A5cr-8UQN_UwDw/exec" target="_top" class="btn-fallback">
      Abrir Sistema Directamente
    </a>
  </div>

</body>
</html>
